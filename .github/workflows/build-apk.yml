name: Build APK Reader

# APK hanya berubah kalau kode aplikasinya berubah (folder android-app).
# Update isi buku cukup push folder content/ — APK membaca konten terbaru
# dari repo ini setiap dibuka, jadi TIDAK perlu build/install ulang.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"
    tags:
      - "apk-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repo
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK (debug, bisa langsung diinstall)
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: buku-mini-fauna-reader
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Buat GitHub Release kalau push tag apk-v*
        if: startsWith(github.ref, 'refs/tags/apk-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
